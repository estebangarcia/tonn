name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # Step 1: semantic-release determines version, generates changelog, creates GitHub release
  semantic-release:
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      new_release_notes: ${{ steps.semantic.outputs.new_release_notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            conventional-changelog-conventionalcommits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Step 2: Build and upload binaries to the release created by semantic-release
  build:
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: tonn-macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            name: tonn-macos-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: tonn-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: tonn-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.semantic-release.outputs.new_release_version }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Build
      - run: cargo build --release --target ${{ matrix.target }}

      # macOS: Create .app bundle and DMG
      - name: Package macOS
        if: startsWith(matrix.os, 'macos')
        env:
          GITHUB_REF_NAME: v${{ needs.semantic-release.outputs.new_release_version }}
        run: |
          chmod +x packaging/macos/package.sh
          ./packaging/macos/package.sh ${{ matrix.target }} ${{ matrix.name }}

      # Linux: Create tarball
      - name: Package Linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          chmod +x packaging/linux/package.sh
          ./packaging/linux/package.sh ${{ matrix.target }} ${{ matrix.name }}

      # Windows: Create zip
      - name: Package Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/tonn.exe" -DestinationPath "${{ matrix.name }}.zip"

      # Upload artifacts to the release created by semantic-release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.semantic-release.outputs.new_release_version }}
          files: |
            *.dmg
            *.tar.gz
            *.zip
